    <!-- CARGA EL SDK OFICIAL DE SUPABASE -->
    <script src="https://jsdelivr.net"></script>
    <script>
        // CREDENCIALES COMPROBADAS DE TU PROYECTO 'alinvnvzssapljnbcxzx'
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_pS0eNKhfqJgViI-SDXXuIw_2fSqgst4"; 
        
        // Inicialización segura utilizando el objeto window para evitar bloqueos del navegador
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const PASSWORD_CORRECTA = "klk830"; 
        let isAdminAutenticado = false;

        let partidoInfo = {
            fechaTexto: "", 
            horaTexto: "", 
            campo: "", 
            precio: "",
            limite: 16,
            equiposGuardadosHTML: "" 
        };

        let listaJugadores = [];

        // ESCUCHADORES INICIALES Y TIEMPO REAL NATIVO
        document.addEventListener("DOMContentLoaded", () => {
            cargarDatosDesdeSupabase();
            conectarCanalRealtime();
        });

        async function cargarDatosDesdeSupabase() {
            const { data: partido } = await supabase.from('partido').select('*').eq('id', 1).single();
            if (partido) {
                partidoInfo = {
                    fechaTexto: partido.fecha,
                    horaTexto: partido.hora,
                    campo: partido.campo,
                    precio: partido.precio,
                    limite: partido.limite,
                    equiposGuardadosHTML: partido.equipos // Mapeado exacto según tu columna 'equipos'
                };
            }

            // Descargamos los jugadores ordenados cronológicamente por tu columna 'created_at'
            const { data: jugadores } = await supabase.from('jugadores').select('*').order('created_at', { ascending: true });
            if (jugadores) {
                listaJugadores = jugadores;
            }

            renderizarTodo();
        }

        function conectarCanalRealtime() {
            supabase
                .channel('pachanga-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'partido' }, () => cargarDatosDesdeSupabase())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'jugadores' }, () => cargarDatosDesdeSupabase())
                .subscribe();
        }

        // FUNCIÓN PRINCIPAL DE RENDERIZADO VISUAL Y CÁLCULOS (PARTE 1)
        function renderizarTodo() {
            document.getElementById('disp-fecha').innerText = partidoInfo.fechaTexto || "-";
            document.getElementById('disp-hora').innerText = partidoInfo.horaTexto || "-";
            document.getElementById('disp-campo').innerText = partidoInfo.campo || "-";
            document.getElementById('disp-precio').innerText = partidoInfo.precio || "-";

            if (isAdminAutenticado) {
                document.getElementById('inp-fecha-texto').value = partidoInfo.fechaTexto || "";
                document.getElementById('inp-hora-texto').value = partidoInfo.horaTexto || "";
                document.getElementById('inp-campo').value = partidoInfo.campo || "";
                document.getElementById('inp-precio').value = partidoInfo.precio || "";
                document.getElementById('inp-limite').value = partidoInfo.limite || 16;
            }

            const maxRef = parseInt(partidoInfo.limite) || 16;
            const titularesActuales = Math.min(listaJugadores.length, maxRef);
            const plazasLibres = maxRef - titularesActuales;
            const badgePlazas = document.getElementById('plazas-status');
            
            document.getElementById("titulo-titulares").innerText = `👥 Convocados Titulares (Máx. ${maxRef})`;

            if (plazasLibres > 0) {
                badgePlazas.innerText = `🟢 ¡Quedan ${plazasLibres} plazas disponibles!`;
                badgePlazas.className = "counter-badge";
            } else {
                badgePlazas.innerText = `⚠️ ¡Cupo lleno! Siguiente inscrito irá a lista de espera.`;
                badgePlazas.className = "counter-badge counter-full";
            }
                        
            let precioExtraido = 0;
            if (partidoInfo.precio) {
                precioExtraido = parseFloat(partidoInfo.precio.toString().replace(/[^0-9.]/g, '')) || 0;
            }
            
            const tUL = document.getElementById('lista-titulares');
            const sUL = document.getElementById('lista-suplentes');
            tUL.innerHTML = ""; sUL.innerHTML = "";

            let totalRecaudado = 0;
            let totalPendiente = 0;

            listaJugadores.forEach((j, i) => {
                const posicion = i + 1;
                const esTitular = posicion <= maxRef;
                const li = document.createElement('li');
                
                li.className = esTitular ? "titular-row" : "suplente-row";
                
                if (esTitular) {
                    if (j.pagado) totalRecaudado += precioExtraido;
                    else totalPendiente += precioExtraido;
                }

                li.innerHTML = `
                    <span><strong>${posicion}. ${j.nombre}</strong></span>
                    <div class="player-actions">
                        <span style="color:${j.pagado ? '#10b981':'#ef4444'}; font-weight:bold; font-size:0.9rem;">
                            ${j.pagado ? '✅ Pagado' : '⏳ Pendiente'}
                        </span>
                    </div>
                `;
                
                if (esTitular) tUL.appendChild(li); else sUL.appendChild(li);
            });

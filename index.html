<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pachanga Club V1</title>
    <style>
        :root { 
            --bg-main: #0f172a; 
            --bg-card: #1e293b; 
            --primary: #10b981; 
            --danger: #ef4444; 
            --warning: #f59e0b; 
            --text-light: #f8fafc; 
            --text-muted: #94a3b8; 
            --admin-color: #6366f1; 
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-light); 
            margin: 0; 
            padding: 15px; 
        }
        .container { max-width: 550px; margin: 0 auto; }
        h1 { font-size: 1.8rem; color: var(--primary); text-transform: uppercase; text-align: center; margin-bottom: 20px; }
        h2 { font-size: 1.2rem; margin: 0 0 10px 0; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .card { 
            background-color: var(--bg-card); 
            border-radius: 14px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); 
        }
        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .info-item { background: #111827; padding: 10px; border-radius: 8px; border-left: 4px solid var(--primary); }
        .info-item span { display: block; font-size: 0.8rem; color: var(--text-muted); }
        .counter-badge { 
            background: rgba(16, 185, 129, 0.15); 
            color: var(--primary); 
            padding: 10px; 
            border-radius: 8px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            text-align: center; 
            border: 1px solid var(--primary); 
        }
        .counter-full { background: rgba(245, 158, 11, 0.15); color: var(--warning); border-color: var(--warning); }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
        .btn-admin { background-color: var(--admin-color); }
        .btn-danger { background-color: var(--danger); }
        .btn-wa { background-color: #25d366; color: #111827; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #0f172a; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .titular-row { border-left: 5px solid var(--primary); }
        .suplente-row { border-left: 5px solid var(--warning); }
        .admin-zone { display: none; background: #1e1b4b; border: 2px solid var(--admin-color); padding: 15px; border-radius: 12px; margin-top: 15px; }
        .admin-form-group { margin-bottom: 12px; }
        .admin-form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        .admin-input { width: 95%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; }
        .caja-stats { display: flex; gap: 10px; margin-bottom: 15px; }
        .caja-box { flex: 1; background: #111827; padding: 8px; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Pachanga Club ⚽</h1>

        <!-- 1. PRÓXIMO PARTIDO -->
        <div class="card">
            <h2>Próximo Partido</h2>
            <div id="plazas-status" class="counter-badge">Cargando plazas...</div>
            <div class="grid-info">
                <div class="info-item"><span>📅 Fecha</span><strong id="disp-fecha">-</strong></div>
                <div class="info-item"><span>⏰ Hora</span><strong id="disp-hora">-</strong></div>
                <div class="info-item"><span>🏟️ Campo</span><strong id="disp-campo">-</strong></div>
                <div class="info-item"><span>💵 Precio</span><strong id="disp-precio">-</strong></div>
            </div>
        </div>

        <!-- 2. APUNTARME AUTOMÁTICO -->
        <div class="card">
            <h2>Apuntarse al Partido</h2>
            <input type="text" id="nombre-jugador-nuevo" placeholder="Ej: Raúl Pérez" style="width: 95%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; margin-bottom: 12px; font-size: 1rem;">
            <button class="btn" onclick="inscribirJugador()">Confirmar Asistencia</button>
        </div>

        <!-- 3. LISTAS DE CONVOCADOS -->
        <div class="card">
            <h2>Lista de Inscritos</h2>
            <div style="color:var(--text-muted); font-size:0.9rem; font-weight:bold; margin-bottom:5px;">👥 TITULARES</div>
            <ul id="lista-titulares"></ul>
            <div style="color:var(--warning); font-size:0.9rem; font-weight:bold; margin-top:15px; margin-bottom:5px;">⏳ RESERVAS (SUPLENTES)</div>
            <ul id="lista-suplentes"></ul>
            <div id="resultado-equipos" style="margin-top:20px; background:#0f172a; padding:15px; border-radius:10px; border: 1px dashed var(--admin-color); display:none;"></div>
        </div>
        <!-- 4. PANEL DE CONTROL -->
        <div style="margin-bottom: 30px;">
            <button class="btn btn-admin" id="btn-toggle-admin" onclick="accederAdmin()">🔑 Panel de Administración Oculto</button>
            <div id="panel-secreto" class="admin-zone">
                <h2>Control del Partido</h2>
                <div class="admin-form-group"><label>Fecha:</label><input type="text" id="inp-fecha" class="admin-input"></div>
                <div class="admin-form-group"><label>Hora:</label><input type="text" id="inp-hora" class="admin-input"></div>
                <div class="admin-form-group"><label>Campo:</label><input type="text" id="inp-campo" class="admin-input"></div>
                <div class="admin-form-group"><label>Precio:</label><input type="text" id="inp-precio" class="admin-input"></div>
                <div class="admin-form-group"><label>Límite:</label><input type="number" id="inp-limite" class="admin-input"></div>
                <button class="btn" onclick="guardarPartido()">💾 Guardar Cambios</button>
                <button class="btn btn-danger" onclick="resetTotal()">🚨 RESET TOTAL</button>
                
                <h2>💰 Caja</h2>
                <div class="caja-stats">
                    <div class="caja-box"><span>✅ REC: </span><strong id="caja-rec">0€</strong></div>
                    <div class="caja-box"><span>⏳ PEND: </span><strong id="caja-pend">0€</strong></div>
                </div>
                <ul id="admin-lista-jugadores" style="margin-bottom:20px;"></ul>
                <button class="btn btn-wa" onclick="copiarWhatsApp()">📋 Copiar WhatsApp</button>
                <button class="btn" style="background:#8b5cf6;" onclick="sortearEquipos()">🎲 Sorteo Aleatorio</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE TU NUEVA NUBE COMPACTA JSONBIN (CON TUS CLAVES INTEGRADAS)
        const BIN_ID = "6a87d184f5f4af5e292fb34b"; 
        const MASTER_KEY = "$2a$10$eR95QU2W1ABCYF1R.Nwo4O2GGpaC9vRa3/O53eetHBpLwZtR/2oVe";
        const URL_API = `https://jsonbin.io{BIN_ID}`;

        let baseDatos = { partido: {}, jugadores: [] };
        let isAdmin = false;

        document.addEventListener("DOMContentLoaded", descargarDatos);

        async function descargarDatos() {
            try {
                const res = await fetch(`${URL_API}/latest`, { headers: { "X-Master-Key": MASTER_KEY } });
                const json = await res.json();
                baseDatos = json.record;
                renderizarTodo();
            } catch (e) {
                console.error("Error al descargar datos:", e);
            }
        }

        async function subirDatos() {
            try {
                await fetch(URL_API, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY }, body: JSON.stringify(baseDatos) });
                renderizarTodo();
            } catch (e) {
                console.error("Error al subir datos:", e);
            }
        }
        function renderizarTodo() {
            const p = baseDatos.partido;
            document.getElementById('disp-fecha').innerText = p.fecha || "-";
            document.getElementById('disp-hora').innerText = p.hora || "-";
            document.getElementById('disp-campo').innerText = p.campo || "-";
            document.getElementById('disp-precio').innerText = p.precio ? p.precio + "€" : "-";

            const limite = parseInt(p.limite) || 16;
            const libres = Math.max(0, limite - baseDatos.jugadores.length);
            const status = document.getElementById('plazas-status');
            status.innerText = libres > 0 ? `🟢 ¡Quedan ${libres} plazas disponibles!` : `⚠️ ¡Cupo lleno! Lista de espera activa.`;
            status.className = libres > 0 ? "counter-badge" : "counter-badge counter-full";

            const tUL = document.getElementById('lista-titulares'); const sUL = document.getElementById('lista-suplentes');
            tUL.innerHTML = ""; sUL.innerHTML = "";
            let rec = 0, pend = 0;

            baseDatos.jugadores.forEach((j, i) => {
                const esTitular = (i < limite);
                const li = document.createElement('li');
                li.className = esTitular ? "titular-row" : "suplente-row";
                li.innerHTML = `<span><strong>${i+1}. ${j.nombre}</strong></span><span>${j.pagado ? '✅ Pagado' : '⏳ Pendiente'}</span>`;
                if(esTitular) { tUL.appendChild(li); if(j.pagado) rec += parseFloat(p.precio)||0; else pend += parseFloat(p.precio)||0; } 
                else { sUL.appendChild(li); }
            });

            document.getElementById('caja-rec').innerText = rec + "€"; document.getElementById('caja-pend').innerText = pend + "€";

            const adminUL = document.getElementById('admin-lista-jugadores'); adminUL.innerHTML = "";
            baseDatos.jugadores.forEach((j, i) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${j.nombre}</span><div><input type="checkbox" ${j.pagado?'checked':''} onchange="marcarPago(${i}, this.checked)"> <button onclick="borrarJugador(${i})" style="background:var(--danger); color:white; border:none; border-radius:4px; padding:2px 6px; cursor:pointer;">X</button></div>`;
                adminUL.appendChild(li);
            });

            const box = document.getElementById('resultado-equipos');
            if(p.equipos) { box.style.display = 'block'; box.innerHTML = p.equipos; } else { box.style.display = 'none'; }
        }

        function inscribirJugador() {
            const inp = document.getElementById('nombre-jugador-nuevo'); const n = inp.value.trim();
            if(!n) return alert("Escribe tu nombre");
            if(baseDatos.jugadores.some(j => j.nombre.toLowerCase() === n.toLowerCase())) return alert("Ya estás en la lista");
            baseDatos.jugadores.push({ nombre: n, pagado: false }); inp.value = ""; subirDatos();
        }

        function accederAdmin() {
            let pass = prompt("Contraseña:");
            if(pass === "klk830") { document.getElementById('panel-secreto').style.display = 'block'; isAdmin = true; renderTodoAdmin(); }
        }

        function renderTodoAdmin() {
            const p = baseDatos.partido;
            document.getElementById('inp-fecha').value = p.fecha || ""; document.getElementById('inp-hora').value = p.hora || "";
            document.getElementById('inp-campo').value = p.campo || ""; document.getElementById('inp-precio').value = p.precio || "0";
            document.getElementById('inp-limite').value = p.limite || 16;
        }

        function guardarPartido() {
            baseDatos.partido.fecha = document.getElementById('inp-fecha').value; baseDatos.partido.hora = document.getElementById('inp-hora').value;
            baseDatos.partido.campo = document.getElementById('inp-campo').value; baseDatos.partido.precio = document.getElementById('inp-precio').value;
            baseDatos.partido.limite = document.getElementById('inp-limite').value; subirDatos(); alert("Partido guardado");
        }

        function marcarPago(i, chk) { baseDatos.jugadores[i].pagado = chk; subirDatos(); }
        function borrarJugador(i) { if(confirm("¿Borrar?")) { baseDatos.jugadores.splice(i, 1); subirDatos(); } }
        function resetTotal() { if(confirm("¿Resetear todo?")) { baseDatos.jugadores = []; baseDatos.partido.equipos = ""; subirDatos(); } }

        function copiarWhatsApp() {
            const p = baseDatos.partido; let t = `⚽ *PACHANGA* ⚽\n📅 *Día:* ${p.fecha}\n⏰ *Hora:* ${p.hora}\n🏟️ *Campo:* ${p.campo}\n💵 *Precio:* ${p.precio}€\n\n🟢 *TITULARES:*\n`;
            baseDatos.jugadores.forEach((j, i) => { if(i < p.limite) t += `${i+1}. ${j.nombre} ${j.pagado ? '[✅]' : '[⏳]'}\n`; });
            navigator.clipboard.writeText(t); alert("¡Copiado!");
        }

        function sortearEquipos() {
            let t = baseDatos.jugadores.slice(0, baseDatos.partido.limite).map(j => j.nombre);
            if(t.length < 2) return alert("Faltan jugadores");
            t.sort(() => Math.random() - 0.5); const m = Math.ceil(t.length / 2);
            let html = `<h3>🎲 Sorteo</h3><div style="display:grid; grid-template-columns:1fr 1fr;"><div><b>⚪ BLANCOS</b>`;
            t.slice(0, m).forEach(p => html += `<div>${p}</div>`);
            html += `</div><div><b>⚫ NEGROS</b>`; t.slice(m).forEach(p => html += `<div>${p}</div>`);
            html += `</div></div>`; baseDatos.partido.equipos = html; subirDatos();
        }
    </script>
</body>
</html>
